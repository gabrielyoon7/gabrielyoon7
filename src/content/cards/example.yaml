# 카드 세트 예시. 파일 이름이 세트 이름이 됩니다.
# 글에서: <CardSet set="example" />  ·  PNG: dev 서버 /cards/example/ 에서 다운로드
title: 카드 시스템 예시
format: portrait # portrait(1080×1350) | square(1080×1080) | og(1200×630)
footer: gabrielyoon7.github.io/gabrielyoon7
slides:
  - type: cover
    eyebrow: CARD NEWS
    title: |- # |- 를 쓰면 줄바꿈이 그대로 카드에 반영됩니다
      웹으로 그리고
      필요할 때만 이미지로
    subtitle: 글에는 HTML 그대로, PNG는 브라우저에서 바로

  - type: text
    heading: 왜 웹으로 그리나요?
    body: |
      블로그와 같은 CSS·폰트·색을 그대로 씁니다.
      문구와 데이터는 YAML 한 파일에 두고, 글에는 진짜 텍스트로 넣습니다.
      PNG가 필요할 때만 카드 스튜디오에서 내려받습니다.

